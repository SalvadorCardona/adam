# Le jeu est construit sous `/adam/` (`base` de vite.config.ts) : on
# le sert à ce chemin, comme sur GitHub Pages, et la racine y renvoie.
server {
    listen 80;
    server_name _;

    # Derrière Traefik (HTTPS), nginx ne connaît ni le schéma ni le port publics.
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `?join=CODE` et le reste de la requête suivent la redirection.
    location = / {
        return 302 /adam/$is_args$args;
    }

    # Le service worker et la page doivent se revalider à chaque ouverture :
    # c'est ainsi qu'un redéploiement atteint les joueurs.
    location = /adam/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache";
    }

    # Les fichiers de Vite portent leur empreinte dans leur nom.
    location /adam/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Le reste : fichiers de `public/`, parties de test (`test/index.html`).
    location /adam/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /adam/index.html;
        add_header Cache-Control "no-cache";
    }
}

# L'ancienne adresse : le jeu s'appelait Mobile Factory. Ses clés locales vivent
# dans le `localStorage` de cette origine : une redirection les perdrait. Toute
# page y sert donc la page de transfert (`client/legacy/index.html`), qui les
# envoie à adam.cardona.digital ; l'ancien service worker y est remplacé par un
# worker qui se désinscrit (`client/legacy/sw.js`).
server {
    listen 80;
    server_name mobile-factory.cardona.digital;

    absolute_redirect off;
    root /usr/share/nginx/legacy;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /mobile-factory/sw.js {
        alias /usr/share/nginx/legacy/sw.js;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
