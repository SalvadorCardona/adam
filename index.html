<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover : le canvas passe sous l'encoche et la barre de geste.
      user-scalable=no + maximum-scale=1 : le double-tap de placement ne doit
      jamais être interprété comme un zoom.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#93e8ae" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      L'icône du jeu est une scène SVG de `src/art/brand.ts`, rastérisée par
      `npm run art:brand` : `icon.png` en 1024×1024, `favicon.png` en 64×64,
      pour ne pas télécharger 1024×1024 à chaque chargement. Vite préfixe ces
      chemins absolus par sa `base`, mais pas ceux du manifeste : celui-ci est
      un fichier de `public/`, copié tel quel, et ses chemins y sont donc relatifs.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Adam</title>
    <script
      src="https://umami.cardona.digital/nx.js"
      defer
      data-website-id="4dd25677-8264-4a32-8322-5940742b5936"
      data-domains="hermez.dev"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
